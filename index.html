<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный Суфлер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ЭКРАН 1: Настройки и Ввод -->
    <div id="setup-screen" class="screen">
        <h1>🎙️ Настройка Суфлера</h1>
        
        <!-- Поле ввода текста -->
        <div class="input-group">
            <label for="source-text">Ваш сценарий:</label>
            <textarea id="source-text" placeholder="Вставьте текст сюда..."></textarea>
        </div>

        <!-- Панель настроек -->
        <div class="settings-panel">
            
            <!-- Колонка 1: Визуал -->
            <div class="setting-item">
                <label for="font-size">Размер (px):</label>
                <input type="number" id="font-size" value="60" min="20" max="200">
            </div>

            <div class="setting-item">
                <label for="font-family">Шрифт:</label>
                <select id="font-family">
                    <option value="Arial, sans-serif">Arial (Без засечек)</option>
                    <option value="'Times New Roman', serif">Times (С засечками)</option>
                    <option value="'Courier New', monospace">Courier (Моно)</option>
                    <option value="system-ui">Системный</option>
                </select>
            </div>

            <!-- Колонка 2: Цвета -->
            <div class="setting-item">
                <label for="text-color">Текст:</label>
                <input type="color" id="text-color" value="#ffffff">
            </div>

            <div class="setting-item">
                <label for="bg-color">Фон:</label>
                <input type="color" id="bg-color" value="#000000">
            </div>

            <!-- Колонка 3: Логика -->
            <div class="setting-item full-width">
                <label for="scroll-offset">Скролл, когда осталось слов до низа:</label>
                <select id="scroll-offset">
                    <option value="1">1 (Последнее)</option>
                    <option value="2" selected>2 (Предпоследнее)</option>
                    <option value="3">3 (Третье с конца)</option>
                    <option value="5">5 (Заранее)</option>
                </select>
            </div>
        </div>

        <button id="btn-start" class="primary-btn">▶ ЗАПУСТИТЬ</button>
    </div>

    <!-- ЭКРАН 2: Режим чтения -->
    <div id="prompter-screen" class="screen hidden">
        <!-- Контейнер для текста (стили применятся JS-ом) -->
        <div id="content-display"></div>
        
        <!-- Панель управления (внизу) -->
        <div class="controls">
            <button id="btn-back" class="small-btn">⚙ Настройки</button>
            <div class="mic-container">
                <button id="btn-mic" class="circle-btn">🎤</button>
                <span id="status-indicator">Остановлено</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
